# Üretim PostgreSQL — yalnızca localhost'a bağlı, kalıcı volume.
# Çalıştırma:
#   docker compose --env-file /opt/hamle/env/backend.env -f deploy/docker-compose.prod.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: hamle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hamle}
      POSTGRES_USER: ${DB_USER:-hamle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD gerekli}
    ports:
      - "127.0.0.1:5432:5432"   # SADECE localhost — dışarı kapalı
    volumes:
      - hamle_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hamle}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hamle_pgdata:
