# Hamle Psikoloji — Nginx reverse proxy
# Kur:
#   sudo cp deploy/nginx/hamlepsikoloji.conf /etc/nginx/sites-available/hamlepsikoloji
#   sudo ln -sf /etc/nginx/sites-available/hamlepsikoloji /etc/nginx/sites-enabled/hamlepsikoloji
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Sonra SSL:
#   sudo certbot --nginx -d hamlepsikoloji.com -d www.hamlepsikoloji.com -d api.hamlepsikoloji.com
# (Certbot bu bloklara otomatik 443 + HTTP→HTTPS yönlendirmesi ekler.)

# ---------- Ana site (Next.js) ----------
server {
    listen 80;
    listen [::]:80;
    server_name hamlepsikoloji.com www.hamlepsikoloji.com;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ---------- API + admin (Spring Boot) ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.hamlepsikoloji.com;

    client_max_body_size 12M;   # görsel yükleme (backend limiti 10MB)

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
