<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Hamle Psikoloji — Yönetim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <style>
    :root{
      --plum:#352a44;--plum2:#2a2036;--plum3:#4c3d63;--cream:#f8f4ee;--paper:#fff;
      --mint:#e9fff4;--mint2:#d6f5e6;--line:#e8e0d4;--line2:#efe9df;
      --ink:#241c30;--muted:#6e6878;--terra:#c0763a;--terra-bg:#fbeee1;--danger:#b3261e;
      --shadow:0 14px 34px -20px rgba(42,32,54,.35);--radius:14px;
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{font-family:Inter,system-ui,sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased}
    .serif{font-family:Fraunces,Georgia,serif}
    button{font:inherit;cursor:pointer;border:none;border-radius:999px;padding:.6rem 1.15rem;font-weight:600;transition:.15s}
    button:disabled{opacity:.55;cursor:default}
    .btn{background:var(--plum);color:#fff}
    .btn:hover:not(:disabled){background:var(--plum2)}
    .btn-ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
    .btn-ghost:hover{border-color:var(--plum3);color:var(--plum)}
    .btn-danger{background:var(--paper);color:var(--danger);border:1px solid #f0c9c5}
    .btn-danger:hover{background:#fdecea}
    .btn-sm{padding:.4rem .75rem;font-size:.83rem}
    .btn-icon{padding:.4rem;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center}
    input,textarea,select{width:100%;padding:.62rem .8rem;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;outline:none;transition:.15s}
    input:focus,textarea:focus,select:focus{border-color:var(--plum3);box-shadow:0 0 0 3px rgba(76,61,99,.12)}
    textarea{resize:vertical;line-height:1.6}
    label{display:block;font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem}
    .field{margin-bottom:1rem}
    .card{background:var(--paper);border:1px solid var(--line2);border-radius:var(--radius);box-shadow:var(--shadow)}
    .card-pad{padding:1.3rem}
    .muted{color:var(--muted)}
    .tag{display:inline-block;background:var(--mint);color:#15524e;border-radius:999px;padding:.18rem .65rem;font-size:.74rem;font-weight:600}

    /* Layout */
    .layout{display:flex;min-height:100vh}
    .sidebar{width:250px;flex-shrink:0;background:var(--plum);color:#e9e3ee;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
    .sb-brand{padding:1.4rem 1.4rem 1rem;display:flex;align-items:center;gap:.6rem}
    .sb-logo{width:34px;height:34px;border-radius:9px;background:var(--mint);color:var(--plum);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:Fraunces,serif}
    .sb-brand b{font-family:Fraunces,serif;font-size:1.15rem;color:#fff;line-height:1}
    .sb-brand span{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:#b9aecb}
    .sb-nav{padding:.6rem;flex:1;overflow:auto}
    .sb-item{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;background:transparent;color:#cfc6dc;border-radius:10px;padding:.65rem .8rem;font-weight:500;margin-bottom:.15rem}
    .sb-item:hover{background:rgba(255,255,255,.07);color:#fff}
    .sb-item.active{background:rgba(233,255,244,.14);color:#fff}
    .sb-item svg{width:18px;height:18px;flex-shrink:0;opacity:.9}
    .sb-item .soon{margin-left:auto;font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;background:rgba(255,255,255,.1);padding:.12rem .4rem;border-radius:999px;color:#b9aecb}
    .sb-item.disabled{opacity:.55;cursor:default}
    .sb-item.disabled:hover{background:transparent;color:#cfc6dc}
    .sb-foot{padding:.9rem;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;gap:.5rem;font-size:.85rem}
    .sb-foot .who{color:#cfc6dc}
    /* Mobil üst bar + drawer backdrop (varsayılan: masaüstünde gizli) */
    .mobilebar{display:none;align-items:center;gap:.7rem;padding:.5rem .7rem;background:var(--plum);color:#fff;position:sticky;top:0;z-index:45}
    .mobilebar .mb-brand{display:flex;align-items:center;gap:.5rem;font-size:1.1rem;color:#fff}
    .mobilebar .hb{background:rgba(255,255,255,.12);color:#fff;width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:10px}
    .mobilebar .hb svg{width:22px;height:22px}
    .mobilebar>.btn-sm{margin-left:auto}
    .sb-close{display:none;background:rgba(255,255,255,.12);color:#fff;margin-left:auto}
    .sb-backdrop{display:none;position:fixed;inset:0;background:rgba(20,14,30,.5);z-index:55}

    .main{flex:1;min-width:0;display:flex;flex-direction:column}
    .content{padding:1.6rem 2rem 3rem;max-width:1180px;width:100%;margin:0 auto}
    .page-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.4rem}
    .page-head h1{font-family:Fraunces,serif;font-weight:500;font-size:1.9rem;margin:0}

    /* List */
    .toolbar{display:flex;gap:.6rem;align-items:center;margin-bottom:1rem}
    .search{position:relative;flex:1;max-width:340px}
    .search input{padding-left:2.2rem}
    .search svg{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
    table{width:100%;border-collapse:collapse}
    th,td{text-align:left;padding:.85rem 1rem;border-bottom:1px solid var(--line2);font-size:.92rem;vertical-align:middle}
    th{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:#faf7f2}
    tbody tr:hover{background:#faf8f4}
    .thumb{width:46px;height:46px;border-radius:9px;object-fit:cover;background:var(--mint);flex-shrink:0}
    .row-title{display:flex;align-items:center;gap:.8rem}
    .actions{display:flex;gap:.4rem;justify-content:flex-end}
    .empty{padding:3rem 1rem;text-align:center;color:var(--muted)}

    /* Editor */
    .ed-bar{position:sticky;top:0;z-index:20;background:rgba(248,244,238,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line2);padding:.8rem 2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
    .ed-bar .left{display:flex;align-items:center;gap:.8rem;min-width:0}
    .ed-bar .save-state{font-size:.8rem;color:var(--muted)}
    .ed-grid{display:grid;grid-template-columns:1fr 320px;gap:1.6rem;align-items:start}
    .ed-main .title-in{font-family:Fraunces,serif;font-size:1.9rem;font-weight:500;border:none;padding:.4rem 0;background:transparent}
    .ed-main .title-in:focus{box-shadow:none}
    .ed-main .excerpt-in{border:none;background:transparent;padding:.2rem 0;color:var(--muted);font-size:1rem}
    .ed-main .excerpt-in:focus{box-shadow:none}
    .divider{height:1px;background:var(--line2);margin:1rem 0 1.3rem}
    .side-card{margin-bottom:1.1rem}
    .side-card h3{font-family:Fraunces,serif;font-weight:500;font-size:1.05rem;margin:0 0 .9rem}

    .block{position:relative;background:var(--paper);border:1px solid var(--line2);border-radius:12px;padding:.9rem 1rem;margin-bottom:.7rem;transition:.15s}
    .block:hover{border-color:var(--line)}
    .block-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.55rem}
    .block-kind{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
    .block-ctrls{margin-left:auto;display:flex;gap:.25rem;opacity:0;transition:.15s}
    .block:hover .block-ctrls{opacity:1}
    .block textarea,.block input{border:1px solid transparent;background:#faf8f4}
    .block textarea:focus,.block input:focus{background:#fff;border-color:var(--plum3)}
    .add-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.4rem}
    .add-btn{background:var(--paper);border:1px dashed var(--line);color:var(--muted);border-radius:999px;padding:.45rem .85rem;font-size:.82rem;font-weight:600;display:inline-flex;gap:.35rem;align-items:center}
    .add-btn:hover{border-color:var(--plum3);color:var(--plum);border-style:solid}
    .rt-toolbar{display:flex;gap:.3rem;margin-bottom:.4rem}
    .rt-btn{background:#faf8f4;border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:.25rem .55rem;font-size:.85rem;line-height:1;min-width:30px;font-weight:600}
    .rt-btn:hover{border-color:var(--plum3);color:var(--plum)}
    .insert-bar{height:16px;display:flex;align-items:center;justify-content:center;position:relative}
    .insert-line{width:100%;display:flex;align-items:center;justify-content:center;color:transparent;font-weight:700;font-size:.8rem}
    .insert-bar:hover .insert-line{color:var(--plum3)}
    .insert-bar:hover .insert-line:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line);z-index:0}
    .insert-line span{position:relative;z-index:1;background:var(--paper);padding:0 .4rem}
    .insert-opts{display:flex;gap:.3rem;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:.22rem;box-shadow:var(--shadow);z-index:5}
    .insert-opts button{background:transparent;color:var(--muted);padding:.26rem .6rem;font-size:.77rem;font-weight:600;border-radius:999px}
    .insert-opts button:hover{background:var(--mint);color:var(--plum)}
    /* Önizleme */
    .pv-overlay{position:fixed;inset:0;z-index:60;background:var(--cream);overflow:auto}
    .pv-bar{position:sticky;top:0;background:rgba(248,244,238,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line2);padding:.8rem 1.4rem;display:flex;align-items:center;gap:1rem}
    .pv-article{max-width:720px;margin:0 auto;padding:2.4rem 1.4rem 4rem}
    .pv-date{text-align:center;font-size:.72rem;text-transform:uppercase;letter-spacing:.16em;color:var(--terra);font-weight:700;margin-bottom:.8rem}
    .pv-article h1{font-family:Fraunces,serif;font-weight:500;font-size:2.3rem;text-align:center;line-height:1.12;margin:0 0 1.4rem}
    .pv-cover{width:100%;max-width:420px;display:block;margin:0 auto 2rem;border-radius:16px}
    .pv-article h2{font-family:Fraunces,serif;font-weight:500;font-size:1.5rem;color:#8a7563;margin:2.2rem 0 .6rem}
    .pv-article p{line-height:1.9;color:#3a3346;margin:0 0 1.1rem}
    .pv-article ul{margin:0 0 1.1rem 1.2rem;line-height:1.85}
    .pv-article a{color:var(--plum);text-decoration:underline}
    .pv-img{width:100%;border-radius:14px;margin:1.5rem 0}

    .drop{border:1.5px dashed var(--line);border-radius:12px;padding:1rem;text-align:center;color:var(--muted);font-size:.85rem;cursor:pointer;transition:.15s}
    .drop:hover,.drop.over{border-color:var(--plum3);background:var(--mint)}
    .img-prev{width:100%;border-radius:10px;margin-top:.6rem;display:block}
    .img-prev-sm{max-width:160px}

    /* Liste / çift / checkbox alanları (ekip & hizmet editörleri) */
    .list-row{display:flex;gap:.4rem;align-items:flex-start;margin-bottom:.45rem}
    .list-row>input,.list-row>textarea{flex:1;min-width:0}
    .list-ctrls{display:flex;gap:.2rem;flex-shrink:0}
    .pair-row{border:1px solid var(--line2);border-radius:11px;padding:.75rem;margin-bottom:.6rem;background:#faf8f4}
    .pair-row>input{margin-bottom:.4rem}
    .pair-head{display:flex;align-items:center;margin-bottom:.5rem}
    .checks{display:flex;flex-direction:column;gap:.45rem}
    .check{display:flex;align-items:center;gap:.5rem;font-size:.9rem;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:500;margin:0}
    .check input[type=checkbox]{width:auto;margin:0;flex-shrink:0}
    .settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.1rem;align-items:start}
    /* Ayarlar — ferah, bölümlü düzen */
    .set-wrap{max-width:720px;margin:0 auto}
    .set-section{background:var(--paper);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);padding:1.3rem 1.4rem;margin-bottom:1.1rem}
    .set-section > div > .field:last-child{margin-bottom:0}
    .set-head{margin-bottom:1.1rem;padding-bottom:.85rem;border-bottom:1px solid var(--line2)}
    .set-head h3{font-family:Fraunces,serif;font-weight:500;font-size:1.12rem;margin:0;color:var(--ink)}
    .set-head p{margin:.25rem 0 0;font-size:.82rem;color:var(--muted)}
    .set-row{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
    .set-note{font-size:.78rem;color:var(--muted);background:#faf7f2;border-radius:8px;padding:.55rem .75rem;margin-top:.4rem}
    .set-foot{display:flex;justify-content:flex-end;margin-top:1.2rem;padding-top:1rem;border-top:1px solid var(--line2)}
    /* Ayarlar üst menü (sekmeler) */
    .set-tabs{display:flex;gap:.1rem;flex-wrap:wrap;margin-bottom:1.2rem;border-bottom:1px solid var(--line2)}
    .set-tab{background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;color:var(--muted);padding:.6rem .9rem;font-weight:600;font-size:.9rem;margin-bottom:-1px}
    .set-tab:hover:not(:disabled){background:transparent;color:var(--ink)}
    .set-tab.on{color:var(--plum);border-bottom-color:var(--plum)}
    @media(max-width:560px){.set-row{grid-template-columns:1fr}.set-tab{padding:.55rem .7rem;font-size:.85rem}}

    /* Talepler (leads) */
    .sb-badge{margin-left:auto;background:#d9534f;color:#fff;border-radius:999px;font-size:.62rem;font-weight:700;padding:.08rem .42rem;min-width:18px;text-align:center;line-height:1.55}
    .chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
    .chip{background:var(--paper);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:.35rem .8rem;font-size:.82rem;font-weight:600}
    .chip.on{background:var(--plum);color:#fff;border-color:var(--plum)}
    .lead-list{display:flex;flex-direction:column;gap:.7rem}
    .lead-card{background:var(--paper);border:1px solid var(--line2);border-radius:12px;padding:1rem 1.1rem}
    .lead-head{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
    .lead-name{display:flex;align-items:center;gap:.5rem;font-size:1.02rem}
    .lead-date{font-size:.78rem;white-space:nowrap}
    .lead-meta{margin-top:.35rem;font-size:.88rem;color:var(--muted)}
    .lead-meta a{color:var(--plum)}
    .lead-msg{margin:.6rem 0 0;font-size:.92rem;line-height:1.6;white-space:pre-wrap;color:var(--ink)}
    .lead-actions{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;margin-top:.85rem}
    .lead-note{display:flex;gap:.4rem;margin-top:.6rem}
    .lead-note input{flex:1}
    .lead-st{font-size:.7rem;font-weight:700;padding:.14rem .55rem;border-radius:999px}
    .st-new{background:#fde6cf;color:#8a5316}
    .st-contacted{background:#d7e9ff;color:#1f4d8a}
    .st-closed{background:#dbeadd;color:#2f6b3f}
    /* İçe aktarma modalı */
    .modal-back{position:fixed;inset:0;z-index:70;background:rgba(20,14,30,.5);display:flex;align-items:center;justify-content:center;padding:1rem}
    .modal{background:var(--paper);border-radius:14px;box-shadow:var(--shadow);width:min(640px,100%);max-height:90vh;overflow:auto;padding:1.4rem}
    .modal h3{font-family:Fraunces,serif;font-weight:500;font-size:1.15rem;margin:0 0 .3rem}
    .modal textarea{min-height:220px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem}
    .modal-foot{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-top:.9rem;flex-wrap:wrap}

    /* Toasts */
    .toasts{position:fixed;top:1rem;right:1rem;z-index:50;display:flex;flex-direction:column;gap:.55rem}
    .toast{padding:.7rem 1rem;border-radius:11px;box-shadow:var(--shadow);font-size:.88rem;font-weight:500;min-width:220px;color:#fff;animation:slidein .2s ease}
    .toast.ok{background:#15706a}
    .toast.err{background:#b3261e}
    .toast.info{background:var(--plum)}
    @keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}

    /* Login */
    .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.4rem;background:linear-gradient(160deg,var(--cream),var(--mint))}

    /* ===== Responsive ===== */
    /* Tablet: editör sağ paneli alta iner */
    @media(max-width:880px){
      .ed-grid{grid-template-columns:1fr}
      .content{padding:1.3rem 1.4rem 2.6rem}
      .ed-bar{padding:.8rem 1.4rem}
    }
    /* Telefon / küçük tablet: sidebar hamburger ile açılan kayan panel (drawer) olur */
    @media(max-width:760px){
      .layout{flex-direction:column;min-height:100dvh}
      .mobilebar{display:flex}
      .sb-backdrop{display:block}
      .sidebar{position:fixed;top:0;left:0;height:100dvh;width:min(82vw,264px);transform:translateX(-100%);transition:transform .22s ease;z-index:60;box-shadow:0 0 44px rgba(20,14,30,.45)}
      .sidebar.open{transform:none}
      .sb-close{display:inline-flex}
      .ed-bar{position:static;padding:.7rem 1rem;flex-wrap:wrap;row-gap:.55rem}
      .ed-bar>div:last-child{flex-wrap:wrap;justify-content:flex-end}
      .content{padding:1rem 1rem 2.4rem}
      .page-head{flex-wrap:wrap;gap:.7rem}
      .page-head h1{font-size:1.5rem}
      .btn-icon{width:38px;height:38px}
      .ed-main .title-in{font-size:1.55rem}
      /* blok arası ekleme çubuğu dokunmada görünür/dokunulabilir olsun */
      .insert-bar{height:28px}
      .insert-line{color:#c7bdd6}
    }
    /* Dar telefon: tablo sadeleşir, toast + login sığar */
    @media(max-width:560px){
      .col-hide{display:none}
      th,td{padding:.7rem .6rem;font-size:.86rem}
      .thumb{width:40px;height:40px}
      .toolbar{flex-wrap:wrap}
      .search{max-width:100%}
      .toasts{left:.7rem;right:.7rem}
      .toast{min-width:0;width:100%}
      .ed-bar .save-state{display:none}
      .rt-btn{min-width:36px;padding:.35rem .6rem}
      .pv-article{padding:1.6rem 1.1rem 3rem}
      .pv-article h1{font-size:1.8rem}
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import htm from "https://unpkg.com/htm@3.1.1/dist/htm.module.js";
    const html = htm.bind(React.createElement);
    const { useState, useEffect, useRef, useCallback } = React;
    const API = window.location.origin;

    /* ---------- helpers ---------- */
    function authHeaders(extra) {
      const t = localStorage.getItem("token");
      const h = Object.assign({}, extra || {});
      if (t) h["Authorization"] = "Bearer " + t;
      return h;
    }
    async function api(path, opts) {
      opts = opts || {};
      const headers = authHeaders(opts.headers);
      if (opts.body && !(opts.body instanceof FormData)) headers["Content-Type"] = "application/json; charset=utf-8";
      const res = await fetch(API + path, Object.assign({}, opts, { headers }));
      if (res.status === 401) { localStorage.removeItem("token"); location.reload(); }
      return res;
    }
    async function uploadFile(file) {
      const fd = new FormData(); fd.append("file", file);
      const res = await api("/api/admin/uploads", { method: "POST", body: fd });
      if (!res.ok) throw new Error("upload");
      return (await res.json()).url;
    }
    const TR = { "ç":"c","ğ":"g","ı":"i","ö":"o","ş":"s","ü":"u","İ":"i","Ç":"c","Ğ":"g","Ö":"o","Ş":"s","Ü":"u" };
    function slugify(s) {
      return (s || "").replace(/[çğıöşüİÇĞÖŞÜ]/g, c => TR[c] || c).toLowerCase()
        .normalize("NFD").replace(/[̀-ͯ]/g, "")
        .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    }
    const ICONS = ["leaf","screen","heart","child","person","spark","sun"];
    const KIND_LABEL = { p: "Paragraf", h2: "Ara başlık", ul: "Madde listesi", image: "Görsel" };

    function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
    function inlineMd(s){
      let t = esc(s);
      t = t.replace(/\*\*([^*]+?)\*\*/g, "<strong>$1</strong>");
      t = t.replace(/\*([^*]+?)\*/g, "<em>$1</em>");
      t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      return t;
    }
    function mdToHtml(s){ return inlineMd(s).replace(/\n/g, "<br/>"); }

    function blocksFromApi(content) {
      return (content || []).map(b => {
        if (b.h2 != null) return { kind: "h2", value: b.h2 };
        if (b.ul != null) return { kind: "ul", value: (b.ul || []).join("\n") };
        if (b.image != null) return { kind: "image", value: b.image };
        return { kind: "p", value: b.p || "" };

    function blocksToApi(blocks) {
      return blocks.map(b => {
        if (b.kind === "h2") return { h2: b.value };

    // YZ çıktısındaki JSON'u ayrıştırır (``` işaretlerini ve fazladan metni toleranslı temizler)
    function parseImport(text) {
      let t = (text || "").trim();
      t = t.replace(/^```[a-z]*\s*/i, "").replace(/\s*```$/i, "").trim();
      const a = t.indexOf("{"), b = t.lastIndexOf("}");
      if (a >= 0 && b > a) t = t.slice(a, b + 1);
      let d;
      try { d = JSON.parse(t); } catch (err) { return { error: "Geçersiz JSON: " + err.message }; }
      if (!d || !d.title || !String(d.title).trim()) return { error: "JSON'da 'title' (başlık) alanı zorunlu." };
      if (!Array.isArray(d.content)) d.content = [];
      return { data: d };
    }

    /* ---------- Rich text (paragraf) ---------- */
    function RichText({ value, onChange, placeholder }) {
      const ref = useRef();
      const grow = () => { const el = ref.current; if (el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; } };
      useEffect(() => { grow(); }, []);
      function wrap(mark, ph) {
        const el = ref.current; const s = el.selectionStart, e = el.selectionEnd;
        const sel = value.slice(s, e) || ph;
        const next = value.slice(0, s) + mark + sel + mark + value.slice(e);
        onChange(next);
        requestAnimationFrame(() => { el.focus(); const p = s + mark.length; el.setSelectionRange(p, p + sel.length); grow(); });
      }
      function link() {
        const el = ref.current; const s = el.selectionStart, e = el.selectionEnd;
        const url = prompt("Bağlantı adresi (https://…)"); if (!url) return;
        const sel = value.slice(s, e) || "bağlantı";
        onChange(value.slice(0, s) + "[" + sel + "](" + url + ")" + value.slice(e));
        requestAnimationFrame(grow);
      }
      return html`<div>
        <div class="rt-toolbar">
          <button type="button" class="rt-btn" title="Kalın" onMouseDown=${e => { e.preventDefault(); wrap("**", "kalın"); }}><b>B</b></button>
          <button type="button" class="rt-btn" title="İtalik" onMouseDown=${e => { e.preventDefault(); wrap("*", "italik"); }}><i>I</i></button>
          <button type="button" class="rt-btn" title="Bağlantı" onMouseDown=${e => { e.preventDefault(); link(); }}>🔗</button>
        </div>
        <textarea ref=${ref} rows="3" value=${value} onInput=${grow} onChange=${e => onChange(e.target.value)} placeholder=${placeholder}></textarea>
      </div>`;
    }

               seoTitle: src?.seoTitle || "", seoDescription: src?.seoDescription || "" },

      const [blocks, setBlocks] = useState(initial.blocks);
      const [slugTouched, setSlugTouched] = useState(!!post || !!initial.f.slug);

      // başlık -> slug otomatik
      useEffect(() => { if (!slugTouched) setF(s => Object.assign({}, s, { slug: slugify(s.title) })); }, [f.title, slugTouched]);

      // taslak otomatik kaydet
      useEffect(() => {
        const id = setTimeout(() => {
          localStorage.setItem(draftKey, JSON.stringify({ f, blocks }));
          const d = new Date(); setSaved(`Taslak kaydedildi · ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`);
        }, 800);
        return () => clearTimeout(id);
      }, [f, blocks]);

      function addBlock(kind) { setBlocks(b => b.concat([{ kind, value: "" }])); }
      function insertBlock(index, kind) { setBlocks(b => { const a = b.slice(); a.splice(index, 0, { kind, value: "" }); return a; }); }
      function updBlock(i, v) { setBlocks(b => b.map((x, j) => j === i ? Object.assign({}, x, { value: v }) : x)); }
      function moveBlock(i, d) { setBlocks(b => { const a = b.slice(); const j = i + d; if (j < 0 || j >= a.length) return a; [a[i], a[j]] = [a[j], a[i]]; return a; }); }
      function delBlock(i) { setBlocks(b => b.filter((_, j) => j !== i)); }

      async function save(close) {
        if (!f.title.trim() || !f.slug.trim()) { toast("err", "Başlık ve slug zorunlu."); return; }
        setBusy(true);
        const body = JSON.stringify(Object.assign({}, f, { content: blocksToApi(blocks) }));
        const res = post ? await api("/api/admin/posts/" + post.id, { method: "PUT", body }) : await api("/api/admin/posts", { method: "POST", body });
        setBusy(false);
        if (res.ok) { localStorage.removeItem(draftKey); toast("ok", post ? "Yazı güncellendi." : "Yazı oluşturuldu."); onDone(); }
        else { const e = await res.json().catch(() => ({})); toast("err", "Kaydedilemedi. " + (e.message || "Alanları kontrol edin.")); }
      }

      const autoGrow = e => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; };

      return html`<div>
        ${preview && html`<${Preview} f=${f} blocks=${blocks} onClose=${() => setPreview(false)} />`}
        <div class="ed-bar">
          <div class="left"><button class="btn-ghost btn-icon" onClick=${onCancel} title="Geri">${Ic.back}</button>
            <div style=${{ minWidth: 0 }}><div class="serif" style=${{ fontSize: "1.05rem", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>${post ? "Yazıyı düzenle" : "Yeni yazı"}</div>
              <div class="save-state">${saved || "Değişiklikler otomatik taslağa alınır"}</div></div></div>
          <div style=${{ display: "flex", gap: ".5rem" }}>
            <button class="btn-ghost" onClick=${() => setPreview(true)}>Önizle</button>
            <button class="btn-ghost" onClick=${() => save(false)} disabled=${busy}>Kaydet</button>
            <button class="btn" onClick=${() => save(true)} disabled=${busy}>${busy ? "Kaydediliyor…" : "Kaydet & kapat"}</button>
          </div>
        </div>

        <div class="content">
          <div class="ed-grid">
            <div class="ed-main card card-pad">
              <input class="title-in" placeholder="Yazı başlığı" value=${f.title} onChange=${e => set("title", e.target.value)} />
              <textarea class="excerpt-in" rows="2" placeholder="Kısa özet (liste ve SEO için)" value=${f.excerpt} onInput=${autoGrow} onChange=${e => set("excerpt", e.target.value)}></textarea>
              <div class="divider"></div>

              ${blocks.length === 0 && html`<div class="muted" style=${{ padding: ".5rem 0 1rem" }}>İçerik ekleyerek başlayın ↓</div>`}
              ${blocks.map((b, i) => html`<${React.Fragment} key=${i}>
                ${i === 0 && html`<${InsertBar} onInsert=${k => insertBlock(0, k)} />`}
                <div class="block">
                  <div class="block-head"><span class="block-kind">${KIND_LABEL[b.kind]}</span>
                    <div class="block-ctrls">
                      <button class="btn-ghost btn-icon" onClick=${() => moveBlock(i, -1)} title="Yukarı">${Ic.up}</button>
                      <button class="btn-ghost btn-icon" onClick=${() => moveBlock(i, 1)} title="Aşağı">${Ic.down}</button>
                      <button class="btn-danger btn-icon" onClick=${() => delBlock(i)} title="Sil">${Ic.trash}</button>
                    </div></div>
                  ${b.kind === "h2" ? html`<input value=${b.value} onChange=${e => updBlock(i, e.target.value)} placeholder="Ara başlık" />`
                    : b.kind === "ul" ? html`<textarea rows="3" value=${b.value} onInput=${autoGrow} onChange=${e => updBlock(i, e.target.value)} placeholder="Her satır bir madde (kalın için **metin**)"></textarea>`
                    : b.kind === "image" ? html`<${ImageInput} value=${b.value} onChange=${v => updBlock(i, v)} toast=${toast} small=${true} />`
                    : html`<${RichText} value=${b.value} onChange=${v => updBlock(i, v)} placeholder="Paragraf metni… (**kalın**, *italik*, [bağlantı](url))" />`}
                </div>
                <${InsertBar} onInsert=${k => insertBlock(i + 1, k)} />
              </${React.Fragment}>`)}

              <div class="add-row">
                <button class="add-btn" onClick=${() => addBlock("p")}>+ Paragraf</button>
                <button class="add-btn" onClick=${() => addBlock("h2")}>+ Ara başlık</button>
                <button class="add-btn" onClick=${() => addBlock("ul")}>+ Liste</button>
                <button class="add-btn" onClick=${() => addBlock("image")}>+ Görsel</button>
              </div>
            </div>

            <div class="ed-side">
              <div class="card card-pad side-card">
                <h3>Yayın</h3>
                <div class="field"><label>Slug (URL)</label><input value=${f.slug} onChange=${e => { setSlugTouched(true); set("slug", e.target.value); }} placeholder="otomatik" /></div>
                <div class="field"><label>Kategori</label><input value=${f.category} onChange=${e => set("category", e.target.value)} placeholder="Kaygı, İlişkiler…" /></div>

              <div class="card card-pad side-card">

      const arr = items || [];
      const upd = (i, v) => onChange(arr.map((x, j) => j === i ? v : x));
      const add = () => onChange(arr.concat([""]));
      const del = (i) => onChange(arr.filter((_, j) => j !== i));
      const move = (i, d) => { const a = arr.slice(); const j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; onChange(a); };
      return html`<div class="field">
        ${label && html`<label>${label}</label>`}
        ${arr.map((v, i) => html`<div key=${i} class="list-row">
          ${multiline
            ? html`<textarea rows="2" value=${v} onInput=${autoGrow} onChange=${e => upd(i, e.target.value)} placeholder=${placeholder}></textarea>`
            : html`<input value=${v} onChange=${e => upd(i, e.target.value)} placeholder=${placeholder} />`}
          <div class="list-ctrls">
            <button class="btn-ghost btn-icon" onClick=${() => move(i, -1)} title="Yukarı">${Ic.up}</button>
            <button class="btn-ghost btn-icon" onClick=${() => move(i, 1)} title="Aşağı">${Ic.down}</button>
            <button class="btn-danger btn-icon" onClick=${() => del(i)} title="Sil">${Ic.trash}</button>
          </div>
        </div>`)}
        <button class="add-btn" onClick=${add}>+ ${placeholder || "Satır"} ekle</button>
      </div>`;
    }

    function PairListField({ label, items, onChange, k1, k2, ph1, ph2 }) {
      const arr = items || [];
      const upd = (i, key, v) => onChange(arr.map((x, j) => j === i ? Object.assign({}, x, { [key]: v }) : x));
      const add = () => onChange(arr.concat([{ [k1]: "", [k2]: "" }]));
      const del = (i) => onChange(arr.filter((_, j) => j !== i));
      const move = (i, d) => { const a = arr.slice(); const j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; onChange(a); };
      return html`<div class="field">
        ${label && html`<label>${label}</label>`}
        ${arr.map((it, i) => html`<div key=${i} class="pair-row">
          <div class="pair-head"><span class="block-kind">#${i + 1}</span>

            </div></div>

          <textarea rows="2" value=${it[k2] || ""} onInput=${autoGrow} onChange=${e => upd(i, k2, e.target.value)} placeholder=${ph2}></textarea>
        </div>`)}
        <button class="add-btn" onClick=${add}>+ ekle</button>
      </div>`;
    }

      return html`<div class="checks">
        ${services.map(s => html`<label key=${s.slug} class="check">
          <input type="checkbox" checked=${sel.includes(s.slug)} onChange=${() => toggle(s.slug)} /> ${s.shortTitle || s.title}

    function FaqEditor({ item, onDone, onCancel, toast }) {

    function LeadsList({ toast, onCountChange }) {
      const [items, setItems] = useState(null);
      const [filter, setFilter] = useState("all");
      async function load() {
        const res = await api("/api/admin/leads");
        if (res.ok) { setItems(await res.json()); if (onCountChange) onCountChange(); }
        else toast("err", "Talepler yüklenemedi.");
      }
      useEffect(() => { load(); }, []);
      async function patch(x, body) {
        const res = await api("/api/admin/leads/" + x.id, { method: "PATCH", body: JSON.stringify(body) });
        if (res.ok) { load(); } else toast("err", "Güncellenemedi.");
      }
      async function del(x) {
        if (!confirm(`"${x.name}" talebi silinsin mi?`)) return;
        const res = await api("/api/admin/leads/" + x.id, { method: "DELETE" });
        if (res.ok) { toast("ok", "Talep silindi."); load(); } else toast("err", "Silinemedi.");
      }
      const all = items || [];
      const counts = { all: all.length, new: 0, contacted: 0, closed: 0 };
      all.forEach(x => { counts[x.status] = (counts[x.status] || 0) + 1; });
      const filtered = all.filter(x => filter === "all" || x.status === filter);
      const chips = [["all", "Tümü"], ["new", "Yeni"], ["contacted", "Arandı"], ["closed", "Kapandı"]];
      return html`<div>
        <div class="page-head"><h1>Talepler</h1></div>
        <div class="chips">
          ${chips.map(([k, label]) => html`<button key=${k} class="chip ${filter === k ? "on" : ""}" onClick=${() => setFilter(k)}>${label} (${counts[k] || 0})</button>`)}
        </div>
        ${items === null ? html`<div class="empty">Yükleniyor…</div>`
          : filtered.length === 0 ? html`<div class="empty">${filter === "all" ? "Henüz talep yok. Formdan gelen talepler burada listelenir." : "Bu durumda talep yok."}</div>`
          : html`<div class="lead-list">
              ${filtered.map(x => html`<${LeadCard} key=${x.id} x=${x} onStatus=${s => patch(x, { status: s })} onNote=${n => patch(x, { note: n })} onDel=${() => del(x)} />`)}
            </div>`}
      </div>`;
    }

        <div class="card" style=${{ overflow: "hidden" }}>
          ${items === null ? html`<div class="empty">Yükleniyor…</div>`
            : items.length === 0 ? html`<div class="empty">Belge bulunamadı.</div>`
            : html`<table><thead><tr><th>Belge</th><th class="col-hide">Bölüm</th><th></th></tr></thead><tbody>
              ${items.map(x => html`<tr key=${x.id}>
                <td><div><b>${x.title}</b><div class="muted" style=${{ fontSize: ".8rem" }}>/${x.slug}</div></div></td>
                <td class="col-hide muted">${(x.sections || []).length} bölüm</td>
                <td><div class="actions"><button class="btn-ghost btn-sm" onClick=${() => onEdit(x)}>Düzenle</button></div></td>
              </tr>`)}
            </tbody></table>`}
        </div>
      </div>`;
    }

    function LegalEditor({ item, onDone, onCancel, toast }) {
      const [f, setF] = useState({
        title: item?.title || "", intro: item?.intro || "", sections: item?.sections || [],
      });
      const [busy, setBusy] = useState(false);
      const set = (k, v) => setF(s => Object.assign({}, s, { [k]: v }));
      async function save() {
        if (!f.title.trim()) { toast("err", "Başlık zorunlu."); return; }
        setBusy(true);
        const res = await api("/api/admin/legal-docs/" + item.id, { method: "PUT", body: JSON.stringify(f) });
        setBusy(false);
        if (res.ok) { toast("ok", "Belge güncellendi."); onDone(); }
        else { const e = await res.json().catch(() => ({})); toast("err", "Kaydedilemedi. " + (e.message || "")); }
      }
      return html`<div>
        <div class="ed-bar">
          <div class="left"><button class="btn-ghost btn-icon" onClick=${onCancel} title="Geri">${Ic.back}</button>
            <div style=${{ minWidth: 0 }}><div class="serif" style=${{ fontSize: "1.05rem", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>${item ? item.title : "Belge"}</div>
              <div class="save-state">/${item ? item.slug : ""} · slug sabittir</div></div></div>
          <div style=${{ display: "flex", gap: ".5rem" }}>
            <button class="btn" onClick=${save} disabled=${busy}>${busy ? "Kaydediliyor…" : "Kaydet"}</button>
          </div>
        </div>
        <div class="content"><div class="ed-grid">
          <div class="ed-main card card-pad">
            <input class="title-in" placeholder="Belge başlığı" value=${f.title} onChange=${e => set("title", e.target.value)} />
            <textarea class="excerpt-in" rows="2" placeholder="Giriş paragrafı" value=${f.intro} onInput=${autoGrow} onChange=${e => set("intro", e.target.value)}></textarea>
            <div class="divider"></div>
            <${PairListField} label="Bölümler" items=${f.sections} onChange=${v => set("sections", v)} k1="h" k2="p" ph1="Bölüm başlığı" ph2="Bölüm metni" />
          </div>
          <div class="ed-side">
            <div class="card card-pad side-card"><h3>Bilgi</h3>
              <div class="field" style=${{ margin: 0 }}><label>Slug (sabit)</label><input value=${item ? item.slug : ""} disabled /></div>
              <div class="muted" style=${{ fontSize: ".8rem", marginTop: ".7rem" }}>Bu sayfanın adresi değiştirilemez. İçeriği düzenleyip kaydedin.</div>
            </div>
          </div>
        </div></div>
      </div>`;
    }

    /* ---------- App ---------- */
    function App() {
      const [authed, setAuthed] = useState(!!localStorage.getItem("token"));
      const [section, setSection] = useState("blog");
      const [view, setView] = useState({ name: "list" });
      const [navOpen, setNavOpen] = useState(false);
      const [leadCount, setLeadCount] = useState(0);
      const [toast, toastNode] = useToasts();
      const refreshLeadCount = useCallback(async () => {
        try {
          const res = await api("/api/admin/leads/count");
          if (res.ok) { const d = await res.json(); setLeadCount(d.new || 0); }
        } catch {}
      }, []);
      useEffect(() => { if (localStorage.getItem("token")) refreshLeadCount(); }, [refreshLeadCount]);
      if (!authed) return html`<div>${toastNode}<${Login} onLogin=${() => setAuthed(true)} toast=${toast} /></div>`;
      function logout() { localStorage.removeItem("token"); setAuthed(false); }
      function selectSection(key) { setSection(key); setView({ name: "list" }); setNavOpen(false); }

      const onNew = () => setView({ name: "edit", item: null });
      const onEdit = (x) => setView({ name: "edit", item: x });
      const onImport = (data) => setView({ name: "edit", item: null, seed: data });
      const toList = () => setView({ name: "list" });
      const listProps = { toast, onNew, onEdit, onImport };
      const editing = view.name === "edit";

      const lists = {
        blog: html`<${BlogList} ...${listProps} />`,
        team: html`<${ExpertList} ...${listProps} />`,
        services: html`<${ServiceList} ...${listProps} />`,
        faq: html`<${FaqList} ...${listProps} />`,
        legal: html`<${LegalList} toast=${toast} onEdit=${onEdit} />`,
      };
      const editors = {
        blog: html`<${BlogEditor} post=${view.item} seed=${view.seed} toast=${toast} onDone=${toList} onCancel=${toList} />`,
        team: html`<${ExpertEditor} item=${view.item} toast=${toast} onDone=${toList} onCancel=${toList} />`,
        services: html`<${ServiceEditor} item=${view.item} toast=${toast} onDone=${toList} onCancel=${toList} />`,
        faq: html`<${FaqEditor} item=${view.item} toast=${toast} onDone=${toList} onCancel=${toList} />`,
        legal: html`<${LegalEditor} item=${view.item} toast=${toast} onDone=${toList} onCancel=${toList} />`,
      };

      let body;
      if (section === "settings") body = html`<div class="content"><${SettingsForm} toast=${toast} /></div>`;
      else if (section === "seo") body = html`<div class="content"><${SeoForm} toast=${toast} /></div>`;
      else if (section === "images") body = html`<div class="content"><${ImagesPanel} toast=${toast} /></div>`;
      else if (section === "leads") body = html`<div class="content"><${LeadsList} toast=${toast} onCountChange=${refreshLeadCount} /></div>`;
      else if (editing) body = editors[section];
      else body = html`<div class="content">${lists[section]}</div>`;

      return html`<div>
        ${toastNode}
        <div class="layout">
          <div class="mobilebar">
            <button class="hb" onClick=${() => setNavOpen(true)} aria-label="Menüyü aç">${Ic.menu}</button>
            <div class="mb-brand"><div class="sb-logo">H</div><b class="serif">Hamle</b></div>
            <button class="btn-ghost btn-sm" onClick=${logout}>Çıkış</button>
          </div>
          ${navOpen && html`<div class="sb-backdrop" onClick=${() => setNavOpen(false)}></div>`}
          <${Sidebar} active=${section} onSelect=${selectSection} onLogout=${logout} open=${navOpen} onClose=${() => setNavOpen(false)} leadCount=${leadCount} />
          <div class="main">${body}</div>
        </div>
      </div>`;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
  </script>
</body>
</html>
